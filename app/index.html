<title>Logged</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b14;--panel:#16162a;--line:#2c2c4a;--txt:#f1ecff;--dim:#9a94b8;--gold:#ffcc33;--red:#ff4d6d;--grn:#3ddc84;--blu:#4dc3ff;--pur:#b86bff;--pix:'Press Start 2P',monospace;--body:'VT323',monospace;--pw:112px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-color:#3a2d66 #0b0b14}
body{margin:0;background:radial-gradient(ellipse at top,#1d1336,var(--bg) 60%) fixed;color:var(--txt);font:22px/1.15 var(--body);padding-bottom:110px;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);z-index:50}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blu)}
.px{border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12),3px 3px 0 #000}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,20,.94);backdrop-filter:blur(6px);padding:calc(10px + env(safe-area-inset-top)) 12px 6px;border-bottom:3px solid #000}
.hin{max-width:1400px;margin:0 auto}
h1{font:13px var(--pix);margin:0;color:var(--gold);text-shadow:2px 2px 0 var(--red);display:flex;align-items:center;gap:6px}
h1 .sp{flex:1}
h1 .lg{font-size:16px;letter-spacing:1px}#logo img{display:block;height:36px;width:auto;image-rendering:pixelated}
#banner{position:fixed;left:0;right:0;top:38%;z-index:70;text-align:center;pointer-events:none;display:none}
#banner div{display:inline-block;background:#000;border:4px solid var(--gold);box-shadow:0 0 0 4px var(--red),8px 8px 0 #000;padding:18px 22px;font:16px/1.6 var(--pix);color:var(--gold);text-shadow:3px 3px 0 var(--red);animation:bn 1.8s steps(12) forwards}
#banner small{display:block;font:20px var(--body);color:#fff;text-shadow:none}
@keyframes bn{0%{transform:scale(0) rotate(-8deg)}15%{transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.lb{width:100%;border-collapse:collapse;font-size:19px}.lb th{font:8px var(--pix);color:var(--dim);text-align:right;padding:4px}.lb th:first-child,.lb td:first-child{text-align:left}.lb td{padding:6px 4px;text-align:right;border-top:2px dashed var(--line)}.lb .w{color:var(--gold)}.lb .p{font:9px var(--pix)}
.xp{height:20px;background:#0f0f1e;border:3px solid #000;margin:8px 0}.xp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--grn) 0 8px,#2aa866 8px 10px)}
#sync{font:8px var(--pix);color:var(--dim)}
.icon{background:var(--panel);border:3px solid #000;width:40px;height:40px;font-size:20px;padding:0}
nav{display:flex;gap:6px;margin:8px 0 6px}
nav button{flex:1;background:var(--panel);border:3px solid #000;font:9px var(--pix);padding:10px 2px;box-shadow:3px 3px 0 #000}
nav button.on{background:var(--gold);color:#000}
#q{width:100%;background:#0f0f1e;color:var(--txt);border:3px solid #000;font:21px var(--body);padding:6px 10px;outline:none}
.row{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--panel);border:3px solid #000;padding:4px 9px;font-size:18px}
.chip.on{background:var(--gold);color:#000}.chip.t.on{background:var(--blu)}
select{background:var(--panel);color:var(--txt);border:3px solid #000;font:19px var(--body);padding:4px}
main{padding:10px 12px;max-width:1400px;margin:0 auto}
.view{display:none}.view.on{display:block}
/* hero */
.hero{position:relative;overflow:hidden;min-height:250px;display:flex;align-items:flex-end;margin-bottom:14px;background:#120d24}
.hero .bg{position:absolute;inset:-10px;background-size:cover;background-position:center;image-rendering:pixelated;filter:saturate(1.3) brightness(.45);transform:scale(1.05)}
.hero .fg{position:relative;display:flex;gap:12px;padding:14px;align-items:flex-end;width:100%;background:linear-gradient(transparent,rgba(11,11,20,.95) 60%)}
.hero .tag{font:8px var(--pix);color:#000;background:var(--gold);display:inline-block;padding:4px 6px;margin-bottom:6px}
.hero h2{font:15px/1.4 var(--pix);margin:0 0 6px;text-shadow:3px 3px 0 #000}
.hero p{margin:0 0 8px;font-size:19px;color:#ddd;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .poster{width:100px;height:148px}
.btn{border:3px solid #000;background:var(--panel);font:9px var(--pix);padding:10px 10px;box-shadow:3px 3px 0 #000;text-decoration:none;color:var(--txt);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.g{background:var(--grn);color:#000}.btn.r{background:var(--red);color:#fff}.btn.y{background:var(--gold);color:#000}.btn.b{background:var(--blu);color:#000}
.btns{display:flex;flex-wrap:wrap;gap:8px}
/* rows */
.sec{margin:6px 0 16px}
.sec h3{font:10px/1.4 var(--pix);margin:0 0 8px;color:var(--gold);display:flex;align-items:center;gap:8px}
.sec h3 small{font:17px var(--body);color:var(--dim)}
.sec h3.ser{color:var(--pur)}
.scroller{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.pc{flex:none;width:var(--pw);background:none;border:0;padding:0;text-align:left;scroll-snap-align:start;position:relative}
.pc .poster,.pc .pico{width:var(--pw);height:calc(var(--pw)*1.48)}
.pc .nm{font:8px/1.4 var(--pix);margin-top:5px;height:34px;overflow:hidden;overflow-wrap:anywhere}
.pc .dots{position:absolute;top:6px;left:6px;display:flex;gap:3px}
.dot{font:7px var(--pix);padding:3px 3px;border:2px solid #000;background:#3a3a55;color:#bbb}.dot.y{background:var(--grn);color:#000}.dot.p{background:var(--blu);color:#000}
.pc .sc{position:absolute;top:6px;right:6px;font:17px/1 var(--body);background:#000;color:var(--gold);padding:3px 4px;border:2px solid var(--gold)}
.pc:active{transform:translate(2px,2px)}
.poster{width:68px;height:100px;flex:none;background:#0f0f1e;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #000;box-shadow:inset 0 0 0 2px #fff3,3px 3px 0 #000;outline:2px solid var(--gold);outline-offset:-5px;display:block}
.poster.loading{background:repeating-linear-gradient(45deg,#221a3d 0 6px,#2c2250 6px 12px)}
.poster.lowres{filter:contrast(1.15) saturate(1.2)}
.pico{width:68px;height:100px;flex:none;display:flex;align-items:center;justify-content:center;background:#221a3d;border:3px solid #000;font:22px var(--pix);color:var(--gold)}
/* list */
#list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.card{display:flex;gap:10px;background:var(--panel);padding:8px;text-align:left;width:100%}
.cbody{flex:1;min-width:0}
.t{font:11px/1.45 var(--pix);margin:2px 0 4px;overflow-wrap:anywhere}
.g{color:var(--dim);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.b{font-size:16px;padding:1px 6px;border:2px solid #000;background:#2a2a48}
.b.y{background:var(--grn);color:#000}.b.n{background:#3a3a55;color:var(--dim)}.b.p{background:var(--blu);color:#000}.b.m{background:var(--red);color:#fff}
.rt{font:10px var(--pix);color:var(--gold)}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));height:60px;padding:0 16px;background:var(--red);font:12px var(--pix);color:#fff;z-index:6}
/* overlays */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:10;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom));border-top:3px solid var(--gold)}
.sheet h2{font:12px/1.5 var(--pix);margin:0 0 10px;color:var(--gold)}
.page{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;display:none}
.page.open{display:block}
.pagein{max-width:1100px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 40px}
.back{position:sticky;top:8px;z-index:2}
.lbl{font:9px var(--pix);color:var(--dim);margin:16px 0 6px}
.seg{display:flex;gap:6px}.seg button{flex:1;min-height:48px;background:var(--panel);border:3px solid #000;font-size:20px}
.seg button.on{background:var(--gold);color:#000}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wbtn{min-height:62px;border:3px solid #000;background:var(--panel);font-size:20px;padding:6px}
.wbtn b{display:block;font:10px var(--pix);margin-bottom:4px}
.wbtn.Yes{background:var(--grn);color:#000}.wbtn.As{background:var(--blu);color:#000}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.rate button{height:40px;padding:0;background:var(--panel);border:2px solid #000;font:9px var(--pix)}
.rate button.on{background:var(--gold);color:#000}
textarea,input.f{width:100%;background:#0f0f1e;color:var(--txt);border:3px solid #000;font:20px var(--body);padding:8px}
textarea{min-height:56px}
.acts{display:flex;gap:8px;margin-top:16px}.acts button{flex:1;min-height:52px;border:3px solid #000;font:11px var(--pix)}
.save{background:var(--grn);color:#000}.cancel{background:var(--panel)}
details summary{font:9px var(--pix);color:var(--dim);margin-top:14px;padding:8px 0}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000;border:2px solid var(--gold);padding:8px 12px;display:none;z-index:60;font-size:19px;align-items:center;gap:10px;max-width:92vw}
#toast button{font:8px var(--pix);background:var(--gold);color:#000;border:2px solid #000;padding:6px}
.empty{text-align:center;color:var(--dim);padding:40px}
/* detail */
.dgrid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:10px}
.dtop{display:flex;gap:12px}
.dtop .poster{width:120px;height:178px}
.dt{font:14px/1.45 var(--pix);margin:0 0 8px;color:var(--gold);text-shadow:2px 2px 0 var(--red)}
.meta{color:var(--dim);font-size:19px}
.syn{font-size:21px;line-height:1.25;margin:10px 0;background:var(--panel);padding:10px;border:3px solid #000}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:19px}.kv b{font:8px/2 var(--pix);color:var(--dim)}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cast div{background:var(--panel);border:2px solid #000;padding:5px 7px;font-size:18px}.cast i{display:block;color:var(--dim);font-style:normal;font-size:16px}
.facts li{margin:4px 0;list-style:none;font-size:19px}.facts li:before{content:"★ ";color:var(--gold)}.facts{padding:0;margin:0}
.gch{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.gch span{font-size:16px;border:2px solid #000;background:#2a2a48;padding:0 6px}
.big{font:20px var(--pix);color:var(--gold)}
.yt{width:100%;aspect-ratio:16/9;border:3px solid #000}
/* wheel */
.wwrap{position:relative;width:min(92vw,520px);margin:10px auto 0;aspect-ratio:1}
#wc{width:100%;height:100%;image-rendering:pixelated;display:block}
.bulbs{position:absolute;inset:-4px;pointer-events:none}
.bulbs i{position:absolute;width:12px;height:12px;background:#552;border:2px solid #000;margin:-6px}
.bulbs.flash i:nth-child(odd){animation:fl .3s steps(1) infinite}.bulbs.flash i:nth-child(even){animation:fl .3s steps(1) infinite .15s}
.bulbs.idle i:nth-child(3n){background:var(--gold)}
@keyframes fl{0%{background:var(--gold);box-shadow:0 0 10px var(--gold)}50%{background:var(--red)}}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--red);filter:drop-shadow(3px 3px 0 #000);z-index:2}
#spinBtn{display:block;margin:16px auto;font-size:14px;padding:16px 26px;animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.wpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:30px auto}
.wpick button{min-height:140px;font:12px/1.6 var(--pix)}
.wpick span{font-size:46px;display:block}
.marq{text-align:center;font:13px/1.6 var(--pix);color:var(--gold);text-shadow:3px 3px 0 var(--red);margin:6px 0;animation:mq 1s steps(2) infinite}
@keyframes mq{50%{color:var(--red);text-shadow:3px 3px 0 var(--gold)}}
#conf{position:fixed;inset:0;pointer-events:none;z-index:40;image-rendering:pixelated;width:100%;height:100%}
.res{border:4px solid var(--gold);background:var(--panel);padding:14px;margin-top:14px;box-shadow:6px 6px 0 #000;animation:pop .4s steps(4)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
/* stats */
